name: Refresh and Deploy Dashboard

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 15th day of the month at 09:17 Asia/Bangkok (02:17 UTC).
    - cron: "17 2 15 * *"
  workflow_dispatch:
    inputs:
      through_month:
        description: "Optional last reporting month, YYYY-MM (AD); blank uses latest"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official tourism data
        env:
          THROUGH_MONTH: ${{ inputs.through_month }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            THROUGH_MONTH="$(python -c 'import json; from pathlib import Path; p = Path("outputs/source_metadata.json"); print(json.loads(p.read_text(encoding="utf-8")).get("reporting_through_month", "") if p.exists() else "")')"
          fi
          args=(--refresh)
          if [ -n "$THROUGH_MONTH" ]; then
            args+=(--through-month "$THROUGH_MONTH")
          fi
          python work/fetch_tourism_data.py "${args[@]}"

      - name: Test source selection and reporting periods
        run: python -m unittest discover -s tests -v

      - name: Build static dashboard
        run: python work/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
